id = "tferreira.herdr-pr-ops"
name = "PR//OPS"
version = "0.4.0"
min_herdr_version = "0.9.0"
description = "Pull request mission control: your PRs and review requests as columns by state and swimlanes by repo, with one-key agent reviews, re-checks and ships that open in Herdr panes."
platforms = ["macos", "linux"]

# Needs Node 18+ and an authenticated `gh` on PATH. No npm dependencies.

# On install: bind the board to prefix+d (prefix+alt+d if taken) in a marked
# block of Herdr's config.toml, unless it is already bound. Never fails.
[[build]]
command = ["node", "bin/configure.js", "--apply"]

[[panes]]
id = "board"
title = "PR//OPS"
placement = "popup"
width = "96%"
height = "94%"
command = ["node", "bin/dashboard.js"]

[[panes]]
id = "demo"
title = "PR//OPS demo"
placement = "popup"
width = "96%"
height = "94%"
command = ["node", "bin/dashboard.js", "--demo"]

[[actions]]
id = "demo"
title = "Open PR//OPS demo"
description = "The dashboard with fake data: try the keys, nothing is fetched or launched."
command = ["node", "bin/open.js", "--demo"]

[[actions]]
id = "open"
title = "Open PR//OPS"
description = "Open the pull request dashboard."
command = ["node", "bin/open.js"]

[[actions]]
id = "keybinding"
title = "Bind PR//OPS to a key"
description = "Add the prefix+d binding (prefix+alt+d if taken) to Herdr's config.toml."
command = ["node", "bin/configure.js", "--apply"]

[[actions]]
id = "remove-keybinding"
title = "Remove the PR//OPS key binding"
description = "Take the managed binding out of Herdr's config.toml, e.g. before uninstalling."
command = ["node", "bin/configure.js", "--remove"]

[[actions]]
id = "setup"
title = "Run PR//OPS setup"
description = "Detect your orgs, clone folders and tracker again, and save them to config.json."
command = ["node", "bin/open.js", "--setup"]

[[actions]]
id = "refresh"
title = "Refresh pull requests"
description = "Ask the poller to scan GitHub now."
command = ["node", "bin/open.js", "--refresh"]

[[actions]]
id = "task"
title = "New task from a ticket"
description = "Start an agent on a GitHub, Jira, Linear, YouTrack or Sentry issue."
command = ["node", "bin/open.js", "--task"]

# Ctrl+click an issue link in any pane: open the new-task box with that link
# filled in.
[[link_handlers]]
id = "github-issue"
title = "Start a task on this GitHub issue"
pattern = "^https://github\\.com/[^/]+/[^/]+/issues/[0-9]+"
action = "task"

[[link_handlers]]
id = "jira"
title = "Start a task on this Jira issue"
pattern = "^https://[^/]+\\.atlassian\\.net/browse/[A-Za-z][A-Za-z0-9_]*-[0-9]+"
action = "task"

[[link_handlers]]
id = "linear"
title = "Start a task on this Linear issue"
pattern = "^https://linear\\.app/[^/]+/issue/[A-Za-z][A-Za-z0-9_]*-[0-9]+"
action = "task"

[[link_handlers]]
id = "youtrack"
title = "Start a task on this YouTrack issue"
pattern = "^https://[^/]+\\.youtrack\\.cloud/issue/[A-Za-z][A-Za-z0-9_]*-[0-9]+"
action = "task"

[[link_handlers]]
id = "sentry"
title = "Start a task on this Sentry issue"
pattern = "^https://([^/]+\\.)?sentry\\.io/(organizations/[^/]+/)?issues/[0-9]+"
action = "task"

# One-shot: starts the detached poller, which keeps the cache fresh and sends
# notifications. It exits by itself when the Herdr server goes away.
[[startup]]
command = ["node", "bin/open.js", "--daemon"]
